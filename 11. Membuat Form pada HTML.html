
<!DOCTYPE html>
<html>
<head>
    <title>Belajar Form HTML</title>
</head>
<body>

    <h1>Form Pendaftaran</h1>

    <form>
        <label>Nama Lengkap:</label><br>
        <input type="text" placeholder="Masukkan nama"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Masukkan email"><br><br>

        <label>Password:</label><br>
        <input type="password" placeholder="Masukkan password"><br><br>

        <label>Jenis Kelamin:</label><br>
        <input type="radio" name="gender" value="Laki-laki">
        Laki-laki

        <input type="radio" name="gender" value="Perempuan">
        Perempuan<br><br>

        <label>Hobi:</label><br>
        <input type="checkbox"> Membaca
        <input type="checkbox"> Olahraga
        <input type="checkbox"> Bermain Game<br><br>

        <label>Alamat:</label><br>
        <textarea rows="4" cols="30"></textarea><br><br>

        <button type="submit">Daftar</button>
        <button type="reset">Reset</button>
    </form>

</body>
</html
