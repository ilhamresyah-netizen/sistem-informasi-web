<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>

    <p><b>Teks Tebal</b></p>

    <p><strong>Teks Penting</strong></p>

    <p><i>Teks Miring</i></p>

    <p><em>Teks Penekanan</em></p>

    <p><u>Teks Bergaris Bawah</u></p>

    <p><mark>Teks Berwarna Stabilo</mark></p>

    <p><del>Teks Dicoret</del></p>

    <p>H<sub>2</sub>O</p>

    <p>2<sup>3</sup> = 8</p>

</body>
</html>
